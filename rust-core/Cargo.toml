[package]
name = "mumble_core"
version = "1.2.1"
edition = "2021"

[lib]
name = "mumble_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["tokio", "cli"] }
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rcgen = "0.13"
prost = "0.13"
bytes = "1"
aes = "0.8"
opus = "0.4"
rtrb = "0.3"
p12 = "0.6.3"
base64 = "0.22"
ribergshamra-pkcs12 = "0.11.0"
tempfile = "3.27.0"
hickory-resolver = "0.26"
rustls-platform-verifier = "0.7.1"
sha2 = "0.11.1"
libc = "0.2.191"

rubato = "0.16.2"
hound = "3.5"
rand = "0.9"

[build-dependencies]
cc = "1"
prost-build = "0.13"
