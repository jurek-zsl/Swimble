name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev protobuf-compiler libssl-dev g++
      - name: Start local Murmur fixture
        run: |
          docker pull mumblevoip/mumble-server:latest
          docker run --detach --name murmur-test --publish 127.0.0.1:64738:64738/tcp --publish 127.0.0.1:64738:64738/udp mumblevoip/mumble-server:latest
          for attempt in $(seq 1 100); do
            if docker logs murmur-test 2>&1 | grep -q 'Not registering server as public'; then exit 0; fi
            sleep 0.2
          done
          exit 1
      # Live audio assertions share one Murmur fixture.
      - run: cargo test --manifest-path rust-core/Cargo.toml --locked -- --test-threads=1
      - run: ./scripts/test_acl.sh
      - if: failure()
        run: docker logs murmur-test
  # macOS runners are Apple Silicon; they cross-compile the x86_64 slice so the
  # resulting app is universal and exercises the Intel build path on every PR.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          cache-on-failure: true
      # Opus is built from source for both slices by build_opus.sh; only the
      # build tools come from Homebrew.
      - run: brew install protobuf xcodegen
      - run: ./scripts/check_versions.py
      - run: ./scripts/build_opus.sh
      - run: ./scripts/build_bridge.sh
      - name: Verify universal artifacts
        run: |
          set -euo pipefail
          for artifact in \
            MacClient/Generated/libmumble_core.a \
            rust-core/target/release/swimble-rpc \
            build/opus-macos26/lib/libopus.0.dylib; do
            archs="$(lipo -archs "$artifact")"
            echo "$artifact: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] \
              || { echo "Missing architecture in $artifact"; exit 1; }
          done
      - run: |
          xcodebuild -project MacClient/Swimble.xcodeproj -scheme Swimble \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -derivedDataPath build/ci-derived-data \
            "LIBRARY_SEARCH_PATHS=$PWD/build/opus-macos26/lib $PWD/MacClient/Generated" \
            test
      - name: Verify universal app
        run: |
          set -euo pipefail
          app="build/ci-derived-data/Build/Products/Debug/Swimble.app"
          archs="$(lipo -archs "$app/Contents/MacOS/Swimble")"
          echo "Swimble.app: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] \
            || { echo "App is not universal"; exit 1; }
